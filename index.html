<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffre-Fort Numérique - Media Center</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-screen {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row;
        }

        @media (max-width: 768px) {
            .app-body {
                flex-direction: row;
            }
            .sidebar {
                width: 50% !important;
            }
            .player-container {
                width: 50% !important;
            }
        }

        .sidebar {
            width: 420px;
            background-color: var(--card-bg);
            padding: 0.8rem;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            margin-bottom: 0.3rem;
        }

        .input-group {
            margin-bottom: 0.6rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            background-color: #0b0f19;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .input-group textarea {
            resize: vertical;
            height: 60px;
            font-size: 0.75rem;
        }

        .btn-primary {
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 0.4rem;
            background-color: var(--accent);
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .batch-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0f19;
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            margin-bottom: 0.4rem;
            font-size: 0.7rem;
        }

        .source-card {
            background-color: #0b0f19;
            padding: 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .source-info h4 {
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
            color: var(--text);
        }

        .source-info p {
            font-size: 0.65rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .source-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 0.2rem 0.4rem;
            font-size: 0.65rem;
            border-radius: 0.3rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        /* Tiroir de chaînes avancé avec recherche et tri */
        .channels-drawer {
            margin-top: 0.4rem;
            background: #1e293b;
            border-radius: 0.4rem;
            padding: 0.5rem;
            display: none;
        }

        .channel-controls {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.4rem;
        }

        .channel-controls input, .channel-controls select {
            padding: 0.3rem;
            font-size: 0.7rem;
            border-radius: 0.3rem;
            border: 1px solid var(--border);
            background: #0b0f19;
            color: #fff;
            outline: none;
        }

        .channel-list-container {
            max-height: 180px;
            overflow-y: auto;
        }

        .channel-item {
            padding: 0.3rem;
            font-size: 0.7rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-info-text {
            cursor: pointer;
            flex: 1;
            word-break: break-all;
        }

        .channel-info-text:hover {
            color: var(--accent);
        }

        .badge-country {
            background: #334155;
            padding: 0.1rem 0.3rem;
            border-radius: 0.2rem;
            font-size: 0.6rem;
            margin-right: 0.3rem;
            color: #94a3b8;
        }

        .player-container {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        .no-signal {
            text-align: center;
            color: var(--text-muted);
            padding: 1rem;
        }
    </style>
</head>
<body>

    <div id="app-screen">
        <header>
            <h3 style="font-size: 0.9rem;">📺 Media Portal</h3>
            <div>
                <span style="font-size:0.65rem; color:var(--text-muted);">Recherche &amp; Pays intégrés</span>
            </div>
        </header>

        <div class="app-body">
            <div class="sidebar">
                <div>
                    <p class="section-title">Ajouter une source</p>
                    <form id="add-source-form" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <div class="input-group" style="margin-bottom:0;">
                            <label>Type de source</label>
                            <select id="source-type" onchange="toggleSourceFields()">
                                <option value="m3u_file">Importer un fichier M3U / M3U8</option>
                                <option value="m3u_text">Coller le texte M3U</option>
                                <option value="url">Lien direct / Flux / PHP</option>
                                <option value="youtube">Lien YouTube</option>
                                <option value="stalker">Portail Stalker (URL + MAC)</option>
                            </select>
                        </div>

                        <div class="input-group" style="margin-bottom:0;">
                            <label>Nom de la source</label>
                            <input type="text" id="source-name" placeholder="Ex: Ma Playlist TV..." required>
                        </div>

                        <div class="input-group" style="margin-bottom:0;" id="group-url">
                            <label id="label-url">Sélectionner le fichier M3U</label>
                            <input type="file" id="source-file" accept=".m3u,.m3u8" style="padding: 0.3rem;" required>
                        </div>

                        <div class="input-group" style="margin-bottom:0; display:none;" id="group-mac">
                            <label>Adresse MAC</label>
                            <input type="text" id="source-mac" placeholder="00:1A:79:...">
                        </div>

                        <button type="submit" class="btn-primary" style="padding: 0.5rem; font-size: 0.8rem;">Enregistrer</button>
                    </form>
                </div>

                <hr style="border-color: var(--border);">

                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">
                        <p class="section-title" style="margin-bottom: 0;">Mes Sources</p>
                    </div>
                    
                    <div class="batch-actions">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
                            <input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"> Tout cocher
                        </label>
                        <button class="btn-sm" style="background:var(--danger); color:white;" onclick="deleteSelectedSources()">🗑️ Supprimer</button>
                    </div>

                    <div id="sources-list" style="display: flex; flex-direction: column; gap: 0.4rem;"></div>
                </div>
            </div>

            <div class="player-container" id="player-slot">
                <div class="no-signal">
                    <p style="font-size: 0.9rem; margin-bottom: 0.2rem;">Aucune source</p>
                    <p style="font-size: 0.65rem;">Sélectionnez une chaîne pour lancer la lecture.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem("tv_sources")) localStorage.setItem("tv_sources", JSON.stringify([]));

        window.onload = function() {
            renderSources();
        };

        function toggleSourceFields() {
            const type = document.getElementById("source-type").value;
            const macGroup = document.getElementById("group-mac");
            const macInput = document.getElementById("source-mac");
            const parentGroup = document.getElementById("group-url");

            if (type === "m3u_file") {
                parentGroup.innerHTML = `<label id="label-url">Sélectionner le fichier M3U</label><input type="file" id="source-file" accept=".m3u,.m3u8" style="padding: 0.3rem;" required>`;
            } else if (type === "m3u_text") {
                parentGroup.innerHTML = `<label id="label-url">Collez le texte M3U</label><textarea id="source-text" placeholder="#EXTM3U..." required></textarea>`;
            } else {
                parentGroup.innerHTML = `<label id="label-url">Lien du flux / Fichier</label><input type="text" id="source-url" placeholder="https://..." required>`;
            }

            if (type === "stalker") {
                macGroup.style.display = "block";
                macInput.setAttribute("required", "true");
            } else {
                macGroup.style.display = "none";
                macInput.removeAttribute("required");
            }
        }

        document.getElementById("add-source-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const type = document.getElementById("source-type").value;
            const name = document.getElementById("source-name").value;
            const mac = type === "stalker" ? document.getElementById("source-mac").value : "";

            if (type === "m3u_file") {
                const fileInput = document.getElementById("source-file");
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const text = event.target.result;
                        const channels = parseM3U(text);
                        saveSourceAndRender(type, name, file.name, mac, channels);
                    };
                    reader.readAsText(file);
                }
            } else if (type === "m3u_text") {
                const text = document.getElementById("source-text").value;
                const channels = parseM3U(text);
                saveSourceAndRender(type, name, "Texte collé", mac, channels);
            } else {
                const url = document.getElementById("source-url").value;
                saveSourceAndRender(type, name, url, mac, []);
            }
        });

        function saveSourceAndRender(type, name, url, mac, channels) {
            const sources = JSON.parse(localStorage.getItem("tv_sources"));
            sources.push({ id: Date.now(), type, name, url, mac, channels });
            localStorage.setItem("tv_sources", JSON.stringify(sources));

            document.getElementById("add-source-form").reset();
            toggleSourceFields();
            renderSources();
        }

        // Analyseur intelligent avec détection automatique du nom et du pays
        function parseM3U(content) {
            let channels = [];
            let lines = content.split('\n');
            let currentName = "";
            let currentCountry = "Inconnu";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentName = "";
                    currentCountry = "Inconnu";

                    // Détection du pays via l'attribut tvg-country="..."
                    let countryMatch = line.match(/tvg-country="([^"]+)"/i);
                    if (countryMatch) {
                        currentCountry = countryMatch[1].toUpperCase();
                    } else {
                        // Recherche alternative dans les attributs group-title ou autre
                        let groupMatch = line.match(/group-title="([^"]+)"/i);
                        if (groupMatch) {
                            currentCountry = groupMatch[1];
                        }
                    }

                    // Extraction du nom de la chaîne après la dernière virgule
                    let parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts[parts.length - 1].trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    if (currentName) {
                        channels.push({ 
                            id: Date.now() + Math.random(), 
                            name: currentName, 
                            country: currentCountry, 
                            url: line 
                        });
                        currentName = "";
                        currentCountry = "Inconnu";
                    }
                }
            }
            return channels;
        }

        function deleteSource(id) {
            if (confirm("Supprimer cette source ?")) {
                let sources = JSON.parse(localStorage.getItem("tv_sources"));
                sources = sources.filter(s => s.id !== id);
                localStorage.setItem("tv_sources", JSON.stringify(sources));
                renderSources();
            }
        }

        function deleteChannel(sourceId, channelId, event) {
            event.stopPropagation();
            if (confirm("Supprimer cette chaîne ?")) {
                let sources = JSON.parse(localStorage.getItem("tv_sources"));
                let source = sources.find(s => s.id === sourceId);
                if (source && source.channels) {
                    source.channels = source.channels.filter(ch => ch.id !== channelId);
                    localStorage.setItem("tv_sources", JSON.stringify(sources));
                    renderSources();
                    setTimeout(() => {
                        const drawer = document.getElementById(`drawer-${sourceId}`);
                        if (drawer) drawer.style.display = "block";
                    }, 50);
                }
            }
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.source-checkbox');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        }

        function deleteSelectedSources() {
            const checkboxes = document.querySelectorAll('.source-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("Sélectionnez au moins une source.");
                return;
            }

            if (confirm(`Supprimer ces ${checkboxes.length} source(s) ?`)) {
                let idsToDelete = Array.from(checkboxes).map(cb => Number(cb.value));
                let sources = JSON.parse(localStorage.getItem("tv_sources"));
                
                sources = sources.filter(s => !idsToDelete.includes(s.id));
                localStorage.setItem("tv_sources", JSON.stringify(sources));
                
                document.getElementById("select-all").checked = false;
                renderSources();
            }
        }

        function toggleDrawer(id) {
            const drawer = document.getElementById(`drawer-${id}`);
            drawer.style.display = (drawer.style.display === "block") ? "none" : "block";
        }

        // Filtrage dynamique et tri par ordre (Nom ou Pays)
        function filterAndSortChannels(sourceId) {
            const searchInput = document.getElementById(`search-${sourceId}`).value.toLowerCase();
            const sortBy = document.getElementById(`sort-${sourceId}`).value;
            const container = document.getElementById(`list-channels-${sourceId}`);
            
            let sources = JSON.parse(localStorage.getItem("tv_sources"));
            let source = sources.find(s => s.id === sourceId);
            if (!source || !source.channels) return;

            // Filtrage par nom ou pays
            let filtered = source.channels.filter(ch => 
                ch.name.toLowerCase().includes(searchInput) || 
                ch.country.toLowerCase().includes(searchInput)
            );

            // Tri (Ordre)
            filtered.sort((a, b) => {
                if (sortBy === 'az') return a.name.localeCompare(b.name);
                if (sortBy === 'za') return b.name.localeCompare(a.name);
                if (sortBy === 'country') return a.country.localeCompare(b.country);
                return 0;
            });

            // Affichage dans le tiroir
            let chanListItems = "";
            filtered.forEach(ch => {
                let safeChan = JSON.stringify(ch).replace(/"/g, '&quot;');
                chanListItems += `
                    <div class="channel-item">
                        <span class="badge-country">${ch.country}</span>
                        <span class="channel-info-text" onclick='loadChannel(${safeChan})'>▶ ${ch.name}</span>
                        <button class="btn-sm" style="background:var(--danger); color:white; padding: 0.1rem 0.3rem; font-size:0.6rem;" onclick='deleteChannel(${sourceId}, ${ch.id}, event)'>✕</button>
                    </div>`;
            });
            container.innerHTML = chanListItems || "<p style='font-size:0.65rem; color:var(--text-muted); padding:5px;'>Aucune chaîne trouvée.</p>";
        }

        function renderSources() {
            const listDiv = document.getElementById("sources-list");
            const sources = JSON.parse(localStorage.getItem("tv_sources"));
            listDiv.innerHTML = "";

            if (sources.length === 0) {
                listDiv.innerHTML = "<p style='font-size:0.7rem; color:var(--text-muted);'>Aucune source.</p>";
                return;
            }

            sources.forEach(source => {
                const card = document.createElement("div");
                card.className = "source-card";
                
                let mainActionHtml = "";
                let drawerHtml = "";

                if ((source.type === "m3u_file" || source.type === "m3u_text") && source.channels) {
                    mainActionHtml = `<button class="btn-sm" style="background:var(--accent); color:white;" onclick="toggleDrawer(${source.id})">📺 Chaînes (${source.channels.length})</button>`;
                    
                    let chanListItems = "";
                    source.channels.forEach(ch => {
                        let safeChan = JSON.stringify(ch).replace(/"/g, '&quot;');
                        chanListItems += `
                            <div class="channel-item">
                                <span class="badge-country">${ch.country}</span>
                                <span class="channel-info-text" onclick='loadChannel(${safeChan})'>▶ ${ch.name}</span>
                                <button class="btn-sm" style="background:var(--danger); color:white; padding: 0.1rem 0.3rem; font-size:0.6rem;" onclick='deleteChannel(${source.id}, ${ch.id}, event)'>✕</button>
                            </div>`;
                    });

                    drawerHtml = `
                        <div id="drawer-${source.id}" class="channels-drawer">
                            <div class="channel-controls">
                                <input type="text" id="search-${source.id}" placeholder="Rechercher nom ou pays..." oninput="filterAndSortChannels(${source.id})" style="flex:1;">
                                <select id="sort-${source.id}" onchange="filterAndSortChannels(${source.id})">
                                    <option value="az">Tri: A-Z</option>
                                    <option value="za">Tri: Z-A</option>
                                    <option value="country">Tri: Pays</option>
                                </select>
                            </div>
                            <div class="channel-list-container" id="list-channels-${source.id}">
                                ${chanListItems}
                            </div>
                        </div>`;
                } else {
                    mainActionHtml = `<button class="btn-sm" style="background:var(--accent); color:white;" onclick='loadSource(${JSON.stringify(source)})'>Lancer</button>`;
                }

                card.innerHTML = `
                    <div style="display: flex; width: 100%; align-items: flex-start; gap: 0.4rem;">
                        <input type="checkbox" class="source-checkbox" value="${source.id}" style="margin-top:0.2rem; cursor:pointer; width:0.8rem; height:0.8rem;">
                        <div class="source-info" style="flex:1;">
                            <h4>${source.name}</h4>
                            <p style='color:var(--text-muted);'><em>Type: ${source.type}</em></p>
                            <div class="source-actions">
                                ${mainActionHtml}
                                <button class="btn-sm" style="background:var(--danger); color:white;" onclick="deleteSource(${source.id})">Supprimer</button>
                            </div>
                        </div>
                    </div>
                    ${drawerHtml}
                `;
                listDiv.appendChild(card);
            });
        }

        function loadChannel(channel) {
            const slot = document.getElementById('player-slot');
            slot.innerHTML = ""; 

            const video = document.createElement('video');
            video.id = "main-player";
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            slot.appendChild(video);

            if (Hls.isSupported() && channel.url.includes(".m3u8")) {
                const hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(video);
            } else {
                video.src = channel.url;
            }
        }

        function loadSource(source) {
            const slot = document.getElementById('player-slot');
            slot.innerHTML = ""; 

            if (source.type === "youtube") {
                let videoId = "";
                if (source.url.includes("youtu.be/")) {
                    videoId = source.url.split("youtu.be/")[1].split("?")[0];
                } else if (source.url.includes("watch?v=")) {
                    videoId = source.url.split("watch?v=")[1].split("&")[0];
                } else if (source.url.includes("/live/")) {
                    videoId = source.url.split("/live/")[1].split("?")[0];
                }
                
                if (videoId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                    iframe.allowFullscreen = true;
                    slot.appendChild(iframe);
                } else {
                    slot.innerHTML = "<p style='color:var(--danger); padding: 20px;'>Lien YouTube invalide.</p>";
                }
            } else {
                const video = document.createElement('video');
                video.id = "main-player";
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                slot.appendChild(video);

                if (Hls.isSupported() && source.url.includes(".m3u8")) {
                    const hls = new Hls();
                    hls.loadSource(source.url);
                    hls.attachMedia(video);
                } else {
                    video.src = source.url;
                }
            }
        }
    </script>
</body>
</html>
