<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffre-Fort Numérique - Media Center</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-screen {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Disposition côte à côte permanente */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row;
        }

        @media (max-width: 768px) {
            .app-body {
                flex-direction: row;
            }
            .sidebar {
                width: 50% !important;
            }
            .player-container {
                width: 50% !important;
            }
        }

        .sidebar {
            width: 400px;
            background-color: var(--card-bg);
            padding: 0.8rem;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            margin-bottom: 0.3rem;
        }

        .input-group {
            margin-bottom: 0.6rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            background-color: #0b0f19;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .input-group textarea {
            resize: vertical;
            height: 60px;
            font-size: 0.75rem;
        }

        .btn-primary {
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 0.4rem;
            background-color: var(--accent);
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .batch-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0f19;
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            margin-bottom: 0.4rem;
            font-size: 0.7rem;
        }

        .source-card {
            background-color: #0b0f19;
            padding: 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .source-info h4 {
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
            color: var(--text);
        }

        .source-info p {
            font-size: 0.65rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .source-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 0.2rem 0.4rem;
            font-size: 0.65rem;
            border-radius: 0.3rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .channels-drawer {
            margin-top: 0.4rem;
            background: #1e293b;
            border-radius: 0.4rem;
            padding: 0.4rem;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .channel-item {
            padding: 0.3rem;
            font-size: 0.7rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-name {
            cursor: pointer;
            flex: 1;
            word-break: break-all;
        }

        .channel-name:hover {
            color: var(--accent);
        }

        .player-container {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        .no-signal {
            text-align: center;
            color: var(--text-muted);
            padding: 1rem;
        }
    </style>
</head>
<body>

    <div id="app-screen">
        <header>
            <h3 style="font-size: 0.9rem;">📺 Media Portal</h3>
            <div>
                <span style="font-size:0.65rem; color:var(--text-muted);">Mode côte à côte</span>
            </div>
        </header>

        <div class="app-body">
            <!-- Sidebar (Sources) -->
            <div class="sidebar">
                <div>
                    <p class="section-title">Ajouter une source</p>
                    <form id="add-source-form" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <div class="input-group" style="margin-bottom:0;">
                            <label>Type de source</label>
                            <select id="source-type" onchange="toggleSourceFields()">
                                <option value="m3u_text">Playlist M3U / M3U8 (Texte ou URL)</option>
                                <option value="url">Lien direct / Flux / PHP</option>
                                <option value="youtube">Lien YouTube</option>
                                <option value="stalker">Portail Stalker (URL + MAC)</option>
                            </select>
                        </div>

                        <div class="input-group" style="margin-bottom:0;">
                            <label>Nom de la source</label>
                            <input type="text" id="source-name" placeholder="Ex: Ma Liste TV..." required>
                        </div>

                        <div class="input-group" style="margin-bottom:0;" id="group-url">
                            <label id="label-url">Contenu M3U ou Lien .m3u8</label>
                            <textarea id="source-url" placeholder="#EXTM3U ou https://.../playlist.m3u8"></textarea>
                        </div>

                        <div class="input-group" style="margin-bottom:0; display:none;" id="group-mac">
                            <label>Adresse MAC</label>
                            <input type="text" id="source-mac" placeholder="00:1A:79:...">
                        </div>

                        <button type="submit" class="btn-primary" style="padding: 0.5rem; font-size: 0.8rem;">Enregistrer</button>
                    </form>
                </div>

                <hr style="border-color: var(--border);">

                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">
                        <p class="section-title" style="margin-bottom: 0;">Mes Sources</p>
                    </div>
                    
                    <div class="batch-actions">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
                            <input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"> Tout cocher
                        </label>
                        <button class="btn-sm" style="background:var(--danger); color:white;" onclick="deleteSelectedSources()">🗑️ Supprimer</button>
                    </div>

                    <div id="sources-list" style="display: flex; flex-direction: column; gap: 0.4rem;"></div>
                </div>
            </div>

            <!-- Lecteur Vidéo (Fixé sur le côté) -->
            <div class="player-container" id="player-slot">
                <div class="no-signal">
                    <p style="font-size: 0.9rem; margin-bottom: 0.2rem;">Aucune source</p>
                    <p style="font-size: 0.65rem;">Choisissez une chaîne pour lancer la lecture.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem("tv_sources")) localStorage.setItem("tv_sources", JSON.stringify([]));

        window.onload = function() {
            renderSources();
        };

        function toggleSourceFields() {
            const type = document.getElementById("source-type").value;
            const macGroup = document.getElementById("group-mac");
            const macInput = document.getElementById("source-mac");
            const urlInput = document.getElementById("source-url");

            const parentGroup = urlInput.parentElement;
            if (type === "m3u_text") {
                parentGroup.innerHTML = `<label id="label-url">Contenu M3U ou Lien .m3u8</label><textarea id="source-url" placeholder="#EXTM3U ou https://.../playlist.m3u8"></textarea>`;
            } else {
                parentGroup.innerHTML = `<label id="label-url">Lien du flux / Fichier</label><input type="text" id="source-url" placeholder="https://..." required>`;
            }

            if (type === "stalker") {
                macGroup.style.display = "block";
                macInput.setAttribute("required", "true");
            } else {
                macGroup.style.display = "none";
                macInput.removeAttribute("required");
            }
        }

        document.getElementById("add-source-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const type = document.getElementById("source-type").value;
            const name = document.getElementById("source-name").value;
            let urlContent = document.getElementById("source-url").value.trim();
            const mac = type === "stalker" ? document.getElementById("source-mac").value : "";

            let channels = [];
            if (type === "m3u_text") {
                // Si l'utilisateur a collé un lien web pointant vers un fichier .m3u ou .m3u8 au lieu du texte brut
                if (urlContent.startsWith("http")) {
                    try {
                        const response = await fetch(urlContent);
                        const text = await response.text();
                        channels = parseM3U(text);
                    } catch (err) {
                        alert("Impossible de récupérer le contenu distant (CORS bloqué). Veuillez coller le texte brut du M3U directement.");
                        return;
                    }
                } else {
                    channels = parseM3U(urlContent);
                }
            }

            const sources = JSON.parse(localStorage.getItem("tv_sources"));
            sources.push({ id: Date.now(), type, name, url: urlContent, mac, channels });
            localStorage.setItem("tv_sources", JSON.stringify(sources));

            this.reset();
            toggleSourceFields();
            renderSources();
        });

        function parseM3U(content) {
            let channels = [];
            let lines = content.split('\n');
            let currentName = "";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts[parts.length - 1].trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    if (currentName) {
                        channels.push({ id: Date.now() + Math.random(), name: currentName, url: line });
                        currentName = "";
                    }
                }
            }
            return channels;
        }

        function deleteSource(id) {
            if (confirm("Supprimer cette source ?")) {
                let sources = JSON.parse(localStorage.getItem("tv_sources"));
                sources = sources.filter(s => s.id !== id);
                localStorage.setItem("tv_sources", JSON.stringify(sources));
                renderSources();
            }
        }

        function deleteChannel(sourceId, channelId, event) {
            event.stopPropagation();
            if (confirm("Supprimer cette chaîne ?")) {
                let sources = JSON.parse(localStorage.getItem("tv_sources"));
                let source = sources.find(s => s.id === sourceId);
                if (source && source.channels) {
                    source.channels = source.channels.filter(ch => ch.id !== channelId);
                    localStorage.setItem("tv_sources", JSON.stringify(sources));
                    renderSources();
                    setTimeout(() => {
                        const drawer = document.getElementById(`drawer-${sourceId}`);
                        if (drawer) drawer.style.display = "block";
                    }, 50);
                }
            }
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.source-checkbox');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        }

        function deleteSelectedSources() {
            const checkboxes = document.querySelectorAll('.source-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("Sélectionnez au moins une source.");
                return;
            }

            if (confirm(`Supprimer ces ${checkboxes.length} source(s) ?`)) {
                let idsToDelete = Array.from(checkboxes).map(cb => Number(cb.value));
                let sources = JSON.parse(localStorage.getItem("tv_sources"));
                
                sources = sources.filter(s => !idsToDelete.includes(s.id));
                localStorage.setItem("tv_sources", JSON.stringify(sources));
                
                document.getElementById("select-all").checked = false;
                renderSources();
            }
        }

        function toggleDrawer(id) {
            const drawer = document.getElementById(`drawer-${id}`);
            drawer.style.display = (drawer.style.display === "block") ? "none" : "block";
        }

        function renderSources() {
            const listDiv = document.getElementById("sources-list");
            const sources = JSON.parse(localStorage.getItem("tv_sources"));
            listDiv.innerHTML = "";

            if (sources.length === 0) {
                listDiv.innerHTML = "<p style='font-size:0.7rem; color:var(--text-muted);'>Aucune source.</p>";
                return;
            }

            sources.forEach(source => {
                const card = document.createElement("div");
                card.className = "source-card";
                
                let mainActionHtml = "";
                let drawerHtml = "";

                if (source.type === "m3u_text" && source.channels) {
                    mainActionHtml = `<button class="btn-sm" style="background:var(--accent); color:white;" onclick="toggleDrawer(${source.id})">📺 Chaînes (${source.channels.length})</button>`;
                    
                    let chanListItems = "";
                    source.channels.forEach(ch => {
                        let safeChan = JSON.stringify(ch).replace(/"/g, '&quot;');
                        chanListItems += `
                            <div class="channel-item">
                                <span class="channel-name" onclick='loadChannel(${safeChan})'>▶ ${ch.name}</span>
                                <button class="btn-sm" style="background:var(--danger); color:white; padding: 0.1rem 0.3rem; font-size:0.6rem;" onclick='deleteChannel(${source.id}, ${ch.id}, event)'>✕</button>
                            </div>`;
                    });

                    drawerHtml = `<div id="drawer-${source.id}" class="channels-drawer">${chanListItems}</div>`;
                } else {
                    mainActionHtml = `<button class="btn-sm" style="background:var(--accent); color:white;" onclick='loadSource(${JSON.stringify(source)})'>Lancer</button>`;
                }

                card.innerHTML = `
                    <div style="display: flex; width: 100%; align-items: flex-start; gap: 0.4rem;">
                        <input type="checkbox" class="source-checkbox" value="${source.id}" style="margin-top:0.2rem; cursor:pointer; width:0.8rem; height:0.8rem;">
                        <div class="source-info" style="flex:1;">
                            <h4>${source.name}</h4>
                            <p style='color:var(--text-muted);'><em>Type: ${source.type}</em></p>
                            <div class="source-actions">
                                ${mainActionHtml}
                                <button class="btn-sm" style="background:var(--danger); color:white;" onclick="deleteSource(${source.id})">Supprimer</button>
                            </div>
                        </div>
                    </div>
                    ${drawerHtml}
                `;
                listDiv.appendChild(card);
            });
        }

        function loadChannel(channel) {
            const slot = document.getElementById('player-slot');
            slot.innerHTML = ""; 

            const video = document.createElement('video');
            video.id = "main-player";
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            slot.appendChild(video);

            if (Hls.isSupported() && channel.url.includes(".m3u8")) {
                const hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(video);
            } else {
                video.src = channel.url;
            }
        }

        function loadSource(source) {
            const slot = document.getElementById('player-slot');
            slot.innerHTML = ""; 

            if (source.type === "youtube") {
                let videoId = "";
                if (source.url.includes("youtu.be/")) {
                    videoId = source.url.split("youtu.be/")[1].split("?")[0];
                } else if (source.url.includes("watch?v=")) {
                    videoId = source.url.split("watch?v=")[1].split("&")[0];
                } else if (source.url.includes("/live/")) {
                    videoId = source.url.split("/live/")[1].split("?")[0];
                }
                
                if (videoId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                    iframe.allowFullscreen = true;
                    slot.appendChild(iframe);
                } else {
                    slot.innerHTML = "<p style='color:var(--danger); padding: 20px;'>Lien YouTube invalide.</p>";
                }
            } else {
                const video = document.createElement('video');
                video.id = "main-player";
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                slot.appendChild(video);

                if (Hls.isSupported() && source.url.includes(".m3u8")) {
                    const hls = new Hls();
                    hls.loadSource(source.url);
                    hls.attachMedia(video);
                } else {
                    video.src = source.url;
                }
            }
        }
    </script>
</body>
</html>
