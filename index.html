<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffre-Fort Numérique - Media Center</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #vault-screen {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .vault-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background-color: #0b0f19;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .pin-input {
            letter-spacing: 0.5rem;
            text-align: center;
            font-size: 1.2rem !important;
        }

        .btn-primary {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            background-color: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        #app-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 400px;
            background-color: var(--card-bg);
            padding: 1rem;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            margin-bottom: 0.5rem;
        }

        .batch-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0f19;
            padding: 0.5rem 0.8rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
        }

        .source-card {
            background-color: #0b0f19;
            padding: 0.8rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            transition: border-color 0.2s;
        }

        .source-card:hover {
            border-color: var(--accent);
        }

        .source-card input[type="checkbox"] {
            margin-top: 0.2rem;
            cursor: pointer;
            width: 1rem;
            height: 1rem;
        }

        .source-info {
            flex: 1;
        }

        .source-info h4 {
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
            color: var(--text);
        }

        .source-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .source-actions {
            margin-top: 0.6rem;
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            border-radius: 0.3rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .player-container {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            border: none;
        }

        .no-signal {
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div id="vault-screen">
        <div class="vault-icon">🔒</div>
        <h2>Espace Protégé</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Entrez vos accès pour afficher le contenu</p>
        
        <form id="vault-form">
            <div class="input-group">
                <label for="username">Identifiant</label>
                <input type="text" id="username" placeholder="Identifiant" required>
            </div>
            
            <div class="input-group">
                <label for="pin">Code PIN (4 chiffres)</label>
                <input type="password" id="pin" class="pin-input" maxlength="4" placeholder="••••" required>
            </div>

            <button type="submit" class="btn-primary">Déverrouiller</button>
            <div id="error-msg" class="error-msg">Identifiant ou code PIN incorrect.</div>
        </form>
    </div>

    <div id="app-screen">
        <header>
            <h3 style="font-size: 1rem; letter-spacing: 0.05rem;">📺 Media Portal</h3>
            <div>
                <button onclick="changePin()" class="btn-sm" style="background:#334155; color:white; margin-right:8px;">Modifier PIN</button>
                <button onclick="lockVault()" class="btn-danger">🔒 Verrouiller</button>
            </div>
        </header>

        <div class="app-body">
            <div class="sidebar">
                <div>
                    <p class="section-title">Ajouter une source</p>
                    <form id="add-source-form" style="display: flex; flex-direction: column; gap: 0.8rem;">
                        <div class="input-group" style="margin-bottom:0;">
                            <label>Type de source</label>
                            <select id="source-type" onchange="toggleSourceFields()">
                                <option value="url">Lien direct / Flux / M3U8 / PHP</option>
                                <option value="youtube">Lien YouTube</option>
                                <option value="stalker">Portail Stalker (URL + MAC)</option>
                            </select>
                        </div>

                        <div class="input-group" style="margin-bottom:0;">
                            <label>Nom de la source</label>
                            <input type="text" id="source-name" placeholder="Ex: France 24, Playlist..." required>
                        </div>

                        <div class="input-group" style="margin-bottom:0;" id="group-url">
                            <label id="label-url">Lien du flux / Fichier</label>
                            <input type="text" id="source-url"
